name: Tellurgram APK

# Builds a single arm64 release APK and uploads it as a workflow artifact.
# Builds on prod (pushes, or manual runs without a build-tag) also publish
# it as a GitHub release tagged vX.Y.Z.M, which
# Obtainium installs from (see README). X.Y.Z is APP_VERSION_NAME and M counts
# up from 1 per upstream version. Releases are only published when signed
# with the RELEASE_* key, never the public test key.
# Needs repo secrets APP_ID and APP_HASH (Telegram API credentials from
# https://my.telegram.org). Signs with the RELEASE_KEYSTORE secret (base64
# keystore) plus RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and
# RELEASE_KEY_PASSWORD; without RELEASE_KEYSTORE it falls back to the public
# test keystore in TMessagesProj/config, which is not safe for distribution.

on:
  workflow_dispatch:
    inputs:
      build-tag:
        description: 'MG_BUILD_TAG baked into versionName/versionCode (X.Y.Z.M or X.Y.Z.M.K); empty picks the next release number'
        required: false
        default: ''
  push:
    branches:
      - new
      - prod
    # Only changes that can affect the APK start a build.
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - '.github/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: tellurgram-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Compute version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.build-tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            echo "BUILD_TAG=$INPUT_TAG" >> "$GITHUB_ENV"
            exit 0
          fi
          # The v prefix keeps these tags out of release.yml's '[0-9]*' trigger.
          APP_VN=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          APP_VN_ESC=${APP_VN//./\\.}
          LAST=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name' \
            | grep -E "^v${APP_VN_ESC}\.[0-9]+$" | sed 's/.*\.//' | sort -n | tail -1 || true)
          M=$(( ${LAST:-0} + 1 ))
          # mg-version.gradle packs M into two digits of versionCode.
          [ "$M" -le 99 ] || { echo "No release numbers left for ${APP_VN}" >&2; exit 1; }
          echo "Version: ${APP_VN}.${M}"
          echo "BUILD_TAG=${APP_VN}.${M}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gperf meson libuv1-dev nasm cmake

      - name: Parse NDK and build-tools versions from gradle
        run: |
          gradle_file=TMessagesProj/build.gradle
          ndk=$(grep -oE 'ndkVersion[[:space:]]+"[0-9.]+"' "$gradle_file" | grep -oE '[0-9.]+')
          bt=$(grep -oE "buildToolsVersion[[:space:]]+'[0-9.]+'" "$gradle_file" | grep -oE '[0-9.]+')
          [ -n "$ndk" ] && [ -n "$bt" ] || { echo "could not parse versions from $gradle_file" >&2; exit 1; }
          echo "NDK_VERSION=$ndk"        >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VERSION=$bt" >> "$GITHUB_ENV"

      - name: Ensure NDK and build-tools installed
        run: |
          set -euo pipefail
          ndk_dir="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          bt_dir="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}"
          if [ -f "$ndk_dir/source.properties" ] && [ -d "$bt_dir" ]; then
            exit 0
          fi
          for i in 1 2 3; do
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" && exit 0
            rm -rf "$ndk_dir" "$bt_dir"
            sleep $((i * 10))
          done
          echo "sdkmanager exhausted retries" >&2
          exit 1

      - name: Cache native build outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            TMessagesProj/jni/boringssl/build/arm64-v8a
            TMessagesProj/jni/ffmpeg/arm64-v8a
            TMessagesProj/jni/ffmpeg/include
            TMessagesProj/jni/ffmpeg/.ndk-${{ env.NDK_VERSION }}-arm64-v8a
            TMessagesProj/jni/td/build/arm64-v8a
            TMessagesProj/jni/td/td/generate/auto
            TMessagesProj/jni/td/tdutils/generate/auto
          key: tellurgram-jni-arm64-v8a-ndk${{ env.NDK_VERSION }}-${{ hashFiles('.gitmodules', 'TMessagesProj/jni/*.sh', 'TMessagesProj/jni/ffmpeg/*.sh') }}-${{ github.sha }}
          restore-keys: |
            tellurgram-jni-arm64-v8a-ndk${{ env.NDK_VERSION }}-${{ hashFiles('.gitmodules', 'TMessagesProj/jni/*.sh', 'TMessagesProj/jni/ffmpeg/*.sh') }}-

      - name: Create API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          [ -n "$APP_ID" ] && [ -n "$APP_HASH" ] || { echo "Set the APP_ID and APP_HASH repository secrets" >&2; exit 1; }
          printf 'APP_ID = %s\nAPP_HASH = %s\n' "$APP_ID" "$APP_HASH" > API_KEYS

      - name: Build APK
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING=()
          if [ -n "$KEYSTORE_B64" ]; then
            [ -n "$KS_PASS" ] && [ -n "$KS_KEY_ALIAS" ] && [ -n "$KS_KEY_PASS" ] \
              || { echo "RELEASE_KEYSTORE is set but a RELEASE_* password or alias secret is missing" >&2; exit 1; }
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            SIGNING=(
              -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.keystore"
              -PRELEASE_STORE_PASSWORD="$KS_PASS"
              -PRELEASE_KEY_ALIAS="$KS_KEY_ALIAS"
              -PRELEASE_KEY_PASSWORD="$KS_KEY_PASS"
            )
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE not set; signing with the public test keystore"
          fi
          ./gradlew :TMessagesProj_App:assembleAfatFdArm64Release \
              -PMG_BUILD_TAG="$BUILD_TAG" "${SIGNING[@]}" --no-daemon

      - name: Rename APK
        id: rename
        run: |
          set -euo pipefail
          APK_DIR=TMessagesProj_App/build/outputs/apk/afatFdArm64/release
          DEST="$APK_DIR/Tellurgram-${BUILD_TAG}-arm64-v8a.apk"
          cp "$APK_DIR/afatFdArm64.apk" "$DEST"
          echo "SHA256: $(sha256sum "$DEST" | cut -d' ' -f1)"
          echo "apk_path=${DEST}" >> "$GITHUB_OUTPUT"
          # Fixed name so releases/latest/download/Tellurgram-arm64-v8a.apk
          # always points at the newest build. Obtainium's ^Tellurgram-\d
          # filter skips it.
          cp "$APK_DIR/afatFdArm64.apk" "$APK_DIR/Tellurgram-arm64-v8a.apk"
          echo "latest_path=$APK_DIR/Tellurgram-arm64-v8a.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Tellurgram-${{ env.BUILD_TAG }}-arm64-v8a
          path: ${{ steps.rename.outputs.apk_path }}

      - name: Publish release
        if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || inputs.build-tag == '') && steps.build.outputs.signed == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ env.BUILD_TAG }}
          name: Tellurgram ${{ env.BUILD_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.rename.outputs.apk_path }}
            ${{ steps.rename.outputs.latest_path }}

      - name: Note unpublished release
        if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || inputs.build-tag == '') && steps.build.outputs.signed != 'true'
        run: echo "::warning::Not publishing a release because RELEASE_KEYSTORE is not set"
