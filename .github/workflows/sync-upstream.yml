name: Sync Mercurygram upstream

# Once a day, points the mg-upstream branch at Mercurygram/Mercurygram's head so
# it mirrors upstream exactly, then tries to merge mg-upstream into prod. A
# merge conflict fails the job and leaves prod untouched — resolve locally.
# mg-upstream is force-updated, so a history rewrite upstream just moves it.
#
# GITHUB_TOKEN cannot push commits that change .github/workflows, which
# upstream commits often do. Set the SYNC_TOKEN secret to a PAT with the
# `repo` and `workflow` scopes; without it those pushes are rejected.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout mg-upstream
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: mg-upstream
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Mirror Mercurygram
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/Mercurygram/Mercurygram.git Mercurygram
          upstream=$(git rev-parse --short FETCH_HEAD)
          previous=$(git rev-parse HEAD)
          if [ "$previous" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "mg-upstream already mirrors Mercurygram ${upstream}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git reset --hard FETCH_HEAD
          git push --force-with-lease="mg-upstream:${previous}" origin HEAD:mg-upstream
          echo "Moved mg-upstream to Mercurygram ${upstream}" >> "$GITHUB_STEP_SUMMARY"

      # Runs even when mg-upstream was already current, so prod catches up
      # once an earlier conflict has been resolved by hand.
      - name: Merge mg-upstream into prod
        run: |
          set -euo pipefail
          git checkout -B prod origin/prod
          if git merge-base --is-ancestor mg-upstream HEAD; then
            echo "prod already contains mg-upstream" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-edit -m "Merge mg-upstream into prod" mg-upstream; then
            conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
            git merge --abort
            printf 'Merging mg-upstream into prod conflicts; resolve locally:\n%s\n' "$conflicts" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push origin HEAD:prod
          echo "Merged mg-upstream into prod" >> "$GITHUB_STEP_SUMMARY"
