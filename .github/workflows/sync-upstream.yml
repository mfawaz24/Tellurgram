name: Sync Mercurygram upstream

# Once a day, points the mg-upstream branch at Mercurygram/Mercurygram's head so
# it mirrors upstream exactly, then opens a pull request from mg-upstream into
# prod if prod doesn't contain it yet (prod only accepts pull requests). On a
# conflict, merge mg-upstream into staging locally, resolve it there and promote
# staging; GitHub then marks the mg-upstream pull request as merged.
# mg-upstream is force-updated, so a history rewrite upstream just moves it.
#
# GITHUB_TOKEN cannot push commits that change .github/workflows, which
# upstream commits often do, and pull requests opened with GITHUB_TOKEN don't
# start the prod source guard check that prod requires. Set the SYNC_TOKEN
# secret to a PAT with the `repo` and `workflow` scopes.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout mg-upstream
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: mg-upstream
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Mirror Mercurygram
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/Mercurygram/Mercurygram.git Mercurygram
          upstream=$(git rev-parse --short FETCH_HEAD)
          previous=$(git rev-parse HEAD)
          if [ "$previous" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "mg-upstream already mirrors Mercurygram ${upstream}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git reset --hard FETCH_HEAD
          git push --force-with-lease="mg-upstream:${previous}" origin HEAD:mg-upstream
          echo "Moved mg-upstream to Mercurygram ${upstream}" >> "$GITHUB_STEP_SUMMARY"

      # Runs even when mg-upstream was already current, so a pull request closed
      # without merging is opened again.
      - name: Open a pull request into prod
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          upstream=$(git rev-parse --short mg-upstream)
          if git merge-base --is-ancestor mg-upstream origin/prod; then
            echo "prod already contains Mercurygram ${upstream}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing=$(gh pr list --base prod --head mg-upstream --state open --json url --jq '.[0].url')
          if [ -n "$existing" ]; then
            echo "Pull request into prod already open: ${existing}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git merge-tree --write-tree --name-only origin/prod mg-upstream > merge.out; then
            note="Merges cleanly."
          else
            note=$(printf 'Conflicts; merge mg-upstream into staging locally, resolve there and promote staging:\n\n%s' \
              "$(sed -n '2,/^$/p' merge.out | sed '/^$/d; s/^/- /')")
          fi
          url=$(gh pr create --base prod --head mg-upstream \
            --title "Merge Mercurygram ${upstream} into prod" --body "$note")
          echo "Opened ${url}" | tee -a "$GITHUB_STEP_SUMMARY"
